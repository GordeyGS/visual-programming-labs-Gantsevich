x-typebot-common: &typebot-common
  restart: unless-stopped
  env_file: .env
  depends_on:
    typebot-db:
      condition: service_healthy
    typebot-redis:
      condition: service_healthy
  networks:
    - typebot-network

services:
  typebot-db:
    image: postgres:16-alpine
    container_name: lab5-typebot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: typebot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: typebot
    volumes:
      - ./.typebot/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d typebot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - typebot-network

  typebot-redis:
    image: redis:7-alpine
    container_name: lab5-typebot-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ./.typebot/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - typebot-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: lab5-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - typebot-network

  typebot-builder:
    <<: *typebot-common
    image: baptistearno/typebot-builder:latest
    container_name: lab5-typebot-builder
    ports:
      - "8080:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: redis://typebot-redis:6379

  typebot-viewer:
    <<: *typebot-common
    image: baptistearno/typebot-viewer:latest
    container_name: lab5-typebot-viewer
    ports:
      - "8081:3000"
    environment:
      REDIS_URL: redis://typebot-redis:6379

networks:
  typebot-network:
    driver: bridge
